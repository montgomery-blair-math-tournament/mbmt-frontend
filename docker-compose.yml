services:
    # Node.js service (use with: docker compose up mbmtfrontend --build)
    mbmtfrontend:
        build:
            context: .
            dockerfile: Dockerfile
        image: mbmtfrontend
        container_name: mbmtfrontend
        environment:
            NODE_ENV: production
            PORT: "12890"
        ports:
            - "12890:12890"
        restart: unless-stopped
