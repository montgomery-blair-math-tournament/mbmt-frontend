services:
    # Node.js service (use with: docker compose up mbmtfrontend --build)
    mbmtfrontend:
        build:
            context: .
            dockerfile: Dockerfile
        image: mbmtfrontend
        container_name: mbmtfrontend
        environment:
            NODE_ENV: production
            PORT: "3000"
        ports:
            - "3000:3000"
        restart: unless-stopped
